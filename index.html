<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Teleprompter</title>
    <style>
        :root {
            --bg-color: rgba(18, 18, 18, 0.85); /* Semi-transparent by default */
            --text-color: #ffffff;
            --accent: #3b82f6;
            --glass-bg: rgba(25, 25, 25, 0.85);
        }
        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
        }
        
        /* Camera Background */
        #camera-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -1; display: none;
            transform: scaleX(-1); /* Mirror camera horizontally */
        }

        #controls {
            position: absolute; top: 0; left: 0; width: 100%;
            background: var(--glass-bg); backdrop-filter: blur(10px);
            padding: 15px; box-sizing: border-box; z-index: 100;
            display: flex; flex-wrap: wrap; gap: 15px; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.3s ease;
        }
        #controls.hidden { transform: translateY(-100%); }
        textarea {
            width: 100%; height: 80px;
            background: #2a2a2a; color: #fff;
            border: 1px solid #444; border-radius: 8px;
            padding: 10px; font-size: 16px; resize: vertical;
        }
        button {
            padding: 8px 12px; border: none; border-radius: 6px;
            background: var(--accent); color: white; cursor: pointer;
            font-weight: bold; transition: background 0.2s;
        }
        button:hover { background: #2563eb; }
        .btn-secondary { background: #4b5563; }
        .btn-secondary:hover { background: #374151; }
        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #dc2626; }
        
        .control-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .color-picker { display: flex; align-items: center; gap: 5px; font-size: 14px; }
        
        #prompter-container {
            position: relative; width: 100%; height: 100%;
            display: flex; justify-content: center;
            background-color: var(--bg-color);
        }
        #prompter-text {
            position: absolute; top: 100%; width: 85%;
            font-size: 60px; line-height: 1.5; text-align: center;
            white-space: pre-wrap; padding-bottom: 100vh;
            color: var(--text-color);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .mirrored { transform: scaleX(-1); }
        
        #playback-overlay {
            position: fixed; bottom: 20px; right: 20px; z-index: 101;
            display: none; background: rgba(0,0,0,0.6); padding: 15px; 
            border-radius: 12px; backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <video id="camera-bg" autoplay muted playsinline></video>

    <div id="controls">
        <textarea id="script-input" placeholder="Paste your video script here..."></textarea>
        
        <div style="display: flex; width: 100%; justify-content: space-between; flex-wrap: wrap; gap: 10px;">
            <div class="control-group">
                <button onclick="saveScript()">💾 Save</button>
                <button class="btn-secondary" onclick="loadScript()">📂 Load</button>
                <button class="btn-secondary" onclick="toggleCamera()">📷 Toggle Camera</button>
                <button class="btn-danger" id="record-btn" onclick="toggleRecording()" style="display:none;">🔴 Record Video</button>
            </div>
            
            <div class="control-group">
                <div class="color-picker">
                    <label>Text:</label>
                    <input type="color" id="text-color" value="#ffffff">
                </div>
                <div class="color-picker">
                    <label>Background:</label>
                    <input type="color" id="bg-color" value="#000000">
                </div>
                <label>Size: <input type="range" id="font-size" min="30" max="120" value="60"></label>
                <label>Speed: <input type="range" id="speed" min="1" max="10" value="3"></label>
            </div>
            
            <div class="control-group">
                <button class="btn-secondary" onclick="toggleMirror()">🪞 Mirror Text</button>
                <button onclick="startPrompter()" style="background: #10b981;">▶️ Start Prompter</button>
            </div>
        </div>
    </div>

    <div id="prompter-container" onclick="togglePlayPause()">
        <div id="prompter-text"></div>
    </div>

    <div id="playback-overlay">
        <button onclick="stopPrompter()" class="btn-secondary">⏹ Stop Prompter</button>
        <span id="recording-status" style="color: #ef4444; font-weight: bold; margin-left: 10px; display: none;">⏺ Recording...</span>
    </div>

    <script>
        // UI Elements
        const controls = document.getElementById('controls');
        const scriptInput = document.getElementById('script-input');
        const prompterText = document.getElementById('prompter-text');
        const prompterContainer = document.getElementById('prompter-container');
        const fontSizeSlider = document.getElementById('font-size');
        const speedSlider = document.getElementById('speed');
        const textColorPicker = document.getElementById('text-color');
        const bgColorPicker = document.getElementById('bg-color');
        const overlay = document.getElementById('playback-overlay');
        
        // Camera & Recording Elements
        const cameraBg = document.getElementById('camera-bg');
        const recordBtn = document.getElementById('record-btn');
        const recordingStatus = document.getElementById('recording-status');

        let isPlaying = false;
        let animationId;
        let yPos = window.innerHeight;
        
        // Camera State
        let stream = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;

        // --- IndexedDB Setup ---
        let db;
        const request = indexedDB.open("TeleprompterDB", 1);
        request.onupgradeneeded = e => {
            db = e.target.result;
            if (!db.objectStoreNames.contains("scripts")) db.createObjectStore("scripts", { keyPath: "id" });
        };
        request.onsuccess = e => { db = e.target.result; loadScript(); };

        function saveScript() {
            const tx = db.transaction(["scripts"], "readwrite");
            tx.objectStore("scripts").put({ id: "main_script", content: scriptInput.value });
        }

        function loadScript() {
            const tx = db.transaction(["scripts"], "readonly");
            tx.objectStore("scripts").get("main_script").onsuccess = e => {
                if (e.target.result) scriptInput.value = e.target.result.content;
            };
        }

        // --- Camera & Recording Logic ---
        async function toggleCamera() {
            if (stream) {
                // Turn off camera
                stream.getTracks().forEach(track => track.stop());
                stream = null;
                cameraBg.style.display = 'none';
                prompterContainer.style.backgroundColor = bgColorPicker.value;
                recordBtn.style.display = 'none';
            } else {
                // Turn on camera
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    cameraBg.srcObject = stream;
                    cameraBg.style.display = 'block';
                    
                    // Make the background transparent so the camera shows through
                    updateColors(true);
                    recordBtn.style.display = 'block';
                } catch (err) {
                    alert("Could not access camera/microphone. Please check permissions.");
                }
            }
        }

        function toggleRecording() {
            if (!stream) return;

            if (isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.innerText = "🔴 Record Video";
                recordingStatus.style.display = 'none';
            } else {
                recordedChunks = [];
                mediaRecorder = new MediaRecorder(stream);
                
                mediaRecorder.ondataavailable = e => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };
                
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = 'teleprompter_recording.webm';
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                };

                mediaRecorder.start();
                isRecording = true;
                recordBtn.innerText = "⏹ Stop Recording";
                recordingStatus.style.display = 'inline';
            }
        }

        // --- Design Adjustments ---
        function updateColors(forceTransparent = false) {
            const hexToRgba = (hex, alpha) => {
                const [r, g, b] = hex.match(/\w\w/g).map(x => parseInt(x, 16));
                return `rgba(${r},${g},${b},${alpha})`;
            };

            prompterText.style.color = textColorPicker.value;
            
            if (stream || forceTransparent) {
                // If camera is on, use the selected color but make it 50% transparent
                prompterContainer.style.backgroundColor = hexToRgba(bgColorPicker.value, 0.5);
            } else {
                // Solid background
                prompterContainer.style.backgroundColor = bgColorPicker.value;
            }
        }

        textColorPicker.addEventListener('input', () => updateColors());
        bgColorPicker.addEventListener('input', () => updateColors());
        fontSizeSlider.addEventListener('input', e => prompterText.style.fontSize = e.target.value + 'px');

        function toggleMirror() { prompterText.classList.toggle('mirrored'); }

        // --- Prompter Logic ---
        function startPrompter() {
            const text = scriptInput.value.trim();
            if (!text) return alert("Please enter a script first.");

            prompterText.innerText = text;
            controls.classList.add('hidden');
            overlay.style.display = 'block';
            yPos = window.innerHeight;
            prompterText.style.top = yPos + 'px';
            
            isPlaying = true;
            scrollText();
        }

        function stopPrompter() {
            isPlaying = false;
            cancelAnimationFrame(animationId);
            controls.classList.remove('hidden');
            overlay.style.display = 'none';
        }

        function togglePlayPause() {
            if (controls.classList.contains('hidden')) {
                isPlaying = !isPlaying;
                if (isPlaying) scrollText();
                else cancelAnimationFrame(animationId);
            }
        }

        function scrollText() {
            if (!isPlaying) return;
            yPos -= (parseInt(speedSlider.value) * 0.5);
            prompterText.style.top = yPos + 'px';
            
            if (yPos < -prompterText.clientHeight) {
                stopPrompter();
                return;
            }
            animationId = requestAnimationFrame(scrollText);
        }
        
        // Init colors
        updateColors();
    </script>
</body>
</html>
